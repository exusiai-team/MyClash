# 每月 1 号检查所有依赖的新版本（npm + GitHub Actions，包括大版本），全部合并成同一个 PR；
# 测试通过后由「测试」流程自动合并到 main，Cloudflare 再自动重新部署
version: 2
multi-ecosystem-groups:
  all:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all
