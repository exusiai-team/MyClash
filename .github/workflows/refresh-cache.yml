name: 代抓订阅缓存

# 每 6 小时从 GitHub 的机器抓一次所有机场订阅（管理页也可以按「立即刷新缓存」手动触发），写进 Worker 的 KV；
# 跟 Worker 用同一份缓存，屏蔽 Cloudflare 的机场只靠这里更新
on:
  schedule:
    - cron: '17 */6 * * *' # 每 6 小时（屏蔽 Cloudflare 的机场只靠这份缓存）
  workflow_dispatch:

concurrency: refresh-cache

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      # 只需要 js-yaml，不装 wrangler 等开发依赖
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node scripts/refresh-cache.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
