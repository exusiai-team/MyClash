name: 测试

# PR 只跑一次（pull_request），合并进 main 再跑一次；只改文档时不跑
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# 同一个分支连续推送时，取消还在跑的旧任务
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 每次都用最新的 Node 版本
          node-version: latest
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 用这次的 scripts/sync-scripts.mjs 对上游最新脚本重新生成覆写脚本再测：
      # rules 分支上的是旧补丁生成的，改了补丁就测不到；上游改版导致补丁失效也会在这里报错
      - run: node scripts/sync-scripts.mjs
        env:
          SCRIPTS_ONLY: '1'
          OUT_DIR: ${{ runner.temp }}/rules-out
      - run: npm test
        env:
          GENERATED_DIR: ${{ runner.temp }}/rules-out
      - run: npx wrangler deploy --dry-run --outdir dist

